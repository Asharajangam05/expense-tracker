<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header>
            <h1>💰 Expense Tracker</h1>
            <p>Manage your income and expenses easily</p>
        </header>


        <!-- Summary Section -->
        <section class="summary">

            <div class="summary-card balance">
                <h3>Balance</h3>
                <h2 id="balance">₹0.00</h2>
            </div>

            <div class="summary-card income">
                <h3>Total Income</h3>
                <h2 id="income">₹0.00</h2>
            </div>

            <div class="summary-card expense">
                <h3>Total Expense</h3>
                <h2 id="expense">₹0.00</h2>
            </div>

        </section>


        <!-- Add Transaction -->
        <section class="transaction-section">

            <h2>Add Transaction</h2>

            <form id="transactionForm">

                <div class="form-group">
                    <label for="description">Description</label>

                    <input
                        type="text"
                        id="description"
                        placeholder="Enter description"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="amount">Amount</label>

                    <input
                        type="number"
                        id="amount"
                        placeholder="Enter amount"
                        min="1"
                        step="0.01"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="type">Transaction Type</label>

                    <select id="type" required>

                        <option value="">
                            Select Type
                        </option>

                        <option value="income">
                            Income
                        </option>

                        <option value="expense">
                            Expense
                        </option>

                    </select>

                </div>


                <div class="form-group">
                    <label for="category">Category</label>

                    <select id="category" required>

                        <option value="">
                            Select Category
                        </option>

                        <option value="Food">
                            Food
                        </option>

                        <option value="Transport">
                            Transport
                        </option>

                        <option value="Shopping">
                            Shopping
                        </option>

                        <option value="Education">
                            Education
                        </option>

                        <option value="Bills">
                            Bills
                        </option>

                        <option value="Entertainment">
                            Entertainment
                        </option>

                        <option value="Salary">
                            Salary
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="date">
                        Date
                    </label>

                    <input
                        type="date"
                        id="date"
                        required
                    >

                </div>


                <button type="submit" class="add-btn">
                    + Add Transaction
                </button>

            </form>

        </section>


        <!-- Filter -->
        <section class="filter-section">

            <h2>Transaction History</h2>

            <div class="filters">

                <input
                    type="text"
                    id="search"
                    placeholder="🔍 Search transaction..."
                >

                <select id="filterType">

                    <option value="all">
                        All Transactions
                    </option>

                    <option value="income">
                        Income
                    </option>

                    <option value="expense">
                        Expense
                    </option>

                </select>

                <select id="filterCategory">

                    <option value="all">
                        All Categories
                    </option>

                    <option value="Food">
                        Food
                    </option>

                    <option value="Transport">
                        Transport
                    </option>

                    <option value="Shopping">
                        Shopping
                    </option>

                    <option value="Education">
                        Education
                    </option>

                    <option value="Bills">
                        Bills
                    </option>

                    <option value="Entertainment">
                        Entertainment
                    </option>

                    <option value="Salary">
                        Salary
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>

        </section>


        <!-- Transactions -->
        <section>

            <div id="transactionList" class="transaction-list">

                <p class="empty-message">
                    No transactions found.
                </p>

            </div>

        </section>

    </div>


    <script src="script.js"></script>

</body>

</html>
